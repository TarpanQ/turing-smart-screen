name: Do not commit user configuration

on:
  pull_request:
    paths:
      - 'config.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check-config:
    name: Check config.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify config.json was not changed
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^config\.json$'; then
            echo "::error file=config.json::config.json has been modified. Did you commit your configuration by mistake?"
            exit 1
          fi
