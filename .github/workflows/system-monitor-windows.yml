name: System monitor (Windows)

on:
  push:
    branches:
      - main
      - 'releases/**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  system-monitor:
    name: System monitor (Windows)
    runs-on: windows-latest

    # MSYS2 is preinstalled on the Windows runners (C:\msys64): its UCRT64 shell is used directly
    env:
      MSYSTEM: UCRT64
      CHERE_INVOKING: 1

    defaults:
      run:
        shell: C:\msys64\usr\bin\bash.exe --login -eo pipefail {0}

    strategy:
      fail-fast: false
      matrix:
        theme: [ "3.5inchTheme2" ]

    steps:
    - uses: actions/checkout@v7

    - name: Install build dependencies
      run: |
        packages="gcc pkgconf yaml-cpp nlohmann-json freetype harfbuzz glib2 libpng libjpeg-turbo libusb curl icu gtkmm-4.0 gtest jq"
        pacman -Sy --noconfirm --needed make $(printf 'mingw-w64-ucrt-x86_64-%s ' $packages)

    - name: Check build dependencies
      run: make deps

    - name: Build
      run: make -j4

    - name: Run unit tests
      run: make test

    - name: Run the LibreHardwareMonitor helper
      run: |
        # The runner has administrator rights: the helper must open the sensors and list the CPU ones
        printf 'update\nquit\n' | build/bin/lhm-bridge.exe external/LibreHardwareMonitor | tee lhm-bridge.log
        head -1 lhm-bridge.log | grep -qx ready
        grep -q "^Cpu$(printf '\t')" lhm-bridge.log
        tail -1 lhm-bridge.log | grep -qx end

    - name: Create the distribution
      run: make dist

    - name: Create the installer
      shell: pwsh
      run: |
        $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
        & $iscc /Q /O+ tools\windows-installer\turing-system-monitor.iss
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Get-ChildItem tools\windows-installer\Output

    - name: Configure system monitor
      run: |
        # The distribution has the default config.json: use simulated LCD mode, there is no real HW
        cd dist/turing-system-monitor
        jq '.displays[0].REVISION = "SIMU"' config.json > config.json.tmp && mv config.json.tmp config.json

        # Setup selected theme in config.json
        echo "Using theme ${{ matrix.theme }}"
        jq --arg theme "${{ matrix.theme }}" '.displays[0].THEME = $theme' config.json > config.json.tmp && mv config.json.tmp config.json

    - name: Run system monitor for 20 seconds
      shell: pwsh
      run: |
        # Run from the distribution, without the MSYS2 directories in PATH: every DLL needed must be in its bin/
        $env:PATH = "C:\Windows\System32;C:\Windows"
        $dist = "dist\turing-system-monitor"
        $main = Start-Process -FilePath "$dist\bin\main.exe" -WorkingDirectory $dist -PassThru `
          -RedirectStandardError "$dist\output.log"
        Start-Sleep -Seconds 20
        if ($main.HasExited) {
          Write-Output "main.exe stopped early, exit code $($main.ExitCode)"
          exit 1
        }
        Stop-Process -Id $main.Id -Force

    - name: Check output for errors
      run: |
        cd dist/turing-system-monitor
        echo "######## Output : ########"
        cat output.log
        echo "######## log.log : ########"
        cat log.log

        if grep -qi "error" output.log log.log; then
          echo "Program failed to run, see output above"
          false
        elif grep -qi "exception" output.log log.log; then
          echo "Program failed to run, see output above"
          false
        fi

    - name: Prepare screenshot for archiving
      run: |
        cp dist/turing-system-monitor/screencap.png screenshot-windows-${{ matrix.theme }}.png

    - name: Archive the installer
      uses: actions/upload-artifact@v7
      with:
        name: turing-system-monitor-windows-installer
        path: tools/windows-installer/Output/*.exe
        if-no-files-found: error

    - name: Archive a screenshot
      uses: actions/upload-artifact@v7
      with:
        name: screenshot-windows-${{ matrix.theme }}
        path: screenshot-*.png
