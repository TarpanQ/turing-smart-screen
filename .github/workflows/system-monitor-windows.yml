name: System monitor (Windows)

on:
  push:
    branches:
      - main
      - 'releases/**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  system-monitor:
    name: System monitor (Windows)
    runs-on: windows-latest

    # MSYS2 is preinstalled on the Windows runners (C:\msys64): its UCRT64 shell is used directly
    env:
      MSYSTEM: UCRT64
      CHERE_INVOKING: 1

    defaults:
      run:
        shell: C:\msys64\usr\bin\bash.exe --login -eo pipefail {0}

    strategy:
      fail-fast: false
      matrix:
        theme: [ "3.5inchTheme2" ]

    steps:
    - uses: actions/checkout@v7

    - name: Install build dependencies
      run: |
        packages="gcc pkgconf yaml-cpp nlohmann-json freetype harfbuzz glib2 libpng libjpeg-turbo libusb curl icu gtkmm-4.0 gtest jq"
        pacman -Sy --noconfirm --needed make $(printf 'mingw-w64-ucrt-x86_64-%s ' $packages)

    - name: Check build dependencies
      run: make deps

    - name: Build
      run: make -j4

    - name: Run unit tests
      run: make test

    - name: Run the LibreHardwareMonitor helper
      run: |
        # The runner has administrator rights: the helper must open the sensors and list the CPU ones
        printf 'update\nquit\n' | build/bin/lhm-bridge.exe external/LibreHardwareMonitor | tee lhm-bridge.log
        head -1 lhm-bridge.log | grep -qx ready
        grep -q "^Cpu$(printf '\t')" lhm-bridge.log
        tail -1 lhm-bridge.log | grep -qx end

    - name: Configure system monitor
      run: |
        # config.json is not versioned: start from the example
        cp config.json.example config.json

        # For tests there is no real HW: use simulated LCD mode
        jq '.displays[0].REVISION = "SIMU"' config.json > config.json.tmp && mv config.json.tmp config.json

        # Setup selected theme in config.json
        echo "Using theme ${{ matrix.theme }}"
        jq --arg theme "${{ matrix.theme }}" '.displays[0].THEME = $theme' config.json > config.json.tmp && mv config.json.tmp config.json

    - name: Run system monitor for 20 seconds
      run: |
        build/bin/main.exe > output.log 2>&1 &
        sleep 20
        taskkill //F //IM main.exe || true

    - name: Check output for errors
      run: |
        echo "######## Output : ########"
        cat output.log

        if grep -qi "error" output.log; then
          echo "Program failed to run, see output above"
          false
        elif grep -qi "exception" output.log; then
          echo "Program failed to run, see output above"
          false
        fi

    - name: Prepare screenshot for archiving
      run: |
        cp screencap.png screenshot-windows-${{ matrix.theme }}.png

    - name: Archive a screenshot
      uses: actions/upload-artifact@v7
      with:
        name: screenshot-windows-${{ matrix.theme }}
        path: screenshot-*.png
