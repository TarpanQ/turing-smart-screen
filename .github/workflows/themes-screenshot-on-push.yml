name: System monitor - themes screenshot (on push)

on:
  push:
    branches:
      - main
      - 'releases/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  system-monitor-theme-screenshot:
    name: Update themes screenshot and generate list

    # Don't run this action on forked repositories to avoid conflicts in PR...
    if: github.repository == 'mathoudebine/turing-smart-screen-python'

    runs-on: ubuntu-latest

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config libyaml-cpp-dev nlohmann-json3-dev libfreetype-dev libharfbuzz-dev \
          libglib2.0-dev libpng-dev libjpeg-dev libusb-1.0-0-dev libcurl4-openssl-dev libicu-dev \
          libgtkmm-4.0-dev libgtest-dev

    - name: Build system monitor and tools
      run: make all

    - name: Configure system monitor for screenshot
      run: |
        # config.json is not versioned: start from the example
        cp config.json.example config.json

        # Use random data
        jq '.config.HW_SENSORS = "STUB"' config.json > config.json.tmp && mv config.json.tmp config.json

    - name: Run system monitor on all themes
      run: |
        for dir in res/themes/*/
        do
          if test -f "$dir/theme.yaml"; then
            # Keep only folder name
            theme=`basename "${dir%*/}"`

            # Setup selected theme in config.json
            echo "Using theme $theme"
            jq --arg theme "$theme" '.displays[0].THEME = $theme' config.json > config.json.tmp && mv config.json.tmp config.json

            # For tests there is no real HW: use simulated LCD mode
            jq '.displays[0].REVISION = "SIMU"' config.json > config.json.tmp && mv config.json.tmp config.json

            # Run system-monitor in theme screenshot mode
            build/bin/main -t 10 > output.log 2>&1

            # Copy screen capture on theme folder
            cp screencap.png "$dir/preview.png"
          fi
        done

    - name: Generate theme list Markdown page
      run: |
        build/bin/theme-preview-generator

    - name: Commit theme previews
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: "[GitHub Actions Bot] Update theme previews"
        file_pattern: 'res/themes/*/preview.png res/themes/themes.md'
        status_options: '--untracked-files=no'

    - name: Run if changes have been detected
      if: steps.auto-commit-action.outputs.changes_detected == 'true'
      run: echo "Theme previews have changed!"
