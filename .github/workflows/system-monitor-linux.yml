name: System monitor (Linux)

on:
  push:
    branches:
      - main
      - 'releases/**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  system-monitor:
    name: System monitor (Linux)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        theme: [ "3.5inchTheme2" ]

    steps:
    - uses: actions/checkout@v7

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config libyaml-cpp-dev libfreetype-dev libharfbuzz-dev \
          libglib2.0-dev libpng-dev libjpeg-dev libusb-1.0-0-dev libcurl4-openssl-dev libicu-dev \
          libgtkmm-4.0-dev libgtest-dev

    - name: Build
      run: make

    - name: Run unit tests
      run: make test

    - name: Configure system monitor
      run: |
        # For tests there is no real HW: use simulated LCD mode
        sed -i "/REVISION:/c\  REVISION: SIMU" config.yaml

        # Setup selected theme in config.yaml
        echo "Using theme ${{ matrix.theme }}"
        sed -i "/THEME:/c\  THEME: ${{ matrix.theme }}" config.yaml

    - name: Run system monitor for 20 seconds
      run: |
        build/bin/main > output.log 2>&1 &
        sleep 20

    - name: Check output for errors
      run: |
        echo "######## Output : ########"
        cat output.log

        if grep -qi "error" output.log; then
          echo "Program failed to run, see output above"
          false
        elif grep -qi "exception" output.log; then
          echo "Program failed to run, see output above"
          false
        fi

    - name: Prepare screenshot for archiving
      run: |
        cp screencap.png screenshot-${{ matrix.theme }}.png

    - name: Archive a screenshot
      uses: actions/upload-artifact@v7
      with:
        name: screenshot-${{ matrix.theme }}
        path: screenshot-*.png
