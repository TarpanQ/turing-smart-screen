name: Simple program (Linux)

on:
  push:
    branches:
      - main
      - 'releases/**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  simple-program:
    name: Simple program (Linux)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config libyaml-cpp-dev libfreetype-dev libharfbuzz-dev \
          libglib2.0-dev libpng-dev libjpeg-dev libusb-1.0-0-dev libcurl4-openssl-dev libicu-dev \
          libgtkmm-4.0-dev libgtest-dev

    - name: Build simple program
      run: make simple-program

    - name: Run simple-program during 20 seconds
      run: |
        # For tests there is no real HW: use simulated LCD mode
        sed -i 's/^const std::string REVISION = .*$/const std::string REVISION = "SIMU";/' src/simple-program.cpp
        make simple-program

        # Run the program for 20s
        build/bin/simple-program > output.log 2>&1 &
        sleep 20

    - name: Check output for errors
      run: |
        echo "######## Output : ########"
        cat output.log

        if grep -qi "error" output.log; then
          echo "Program failed to run, see output above"
          false
        elif grep -qi "exception" output.log; then
          echo "Program failed to run, see output above"
          false
        fi

    - name: Prepare screenshot for archiving
      run: |
        cp screencap.png screenshot-simple-program.png

    - name: Archive a screenshot
      uses: actions/upload-artifact@v7
      with:
        name: screenshot-simple-program
        path: screenshot-*.png
